# Explicit Traefik route for Nextcloud. Eventually we should change this back to the default ingress
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-secure
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nextcloud-flourishing.duckdns.org`)
      kind: Rule
      services:
        - name: nextcloud
          port: http
  tls:
    certResolver: letsencrypt
