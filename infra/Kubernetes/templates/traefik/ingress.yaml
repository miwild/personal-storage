
# Grafana — public HTTPS route
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-secure
  namespace: platform-observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana-demo.duckdns.org`)
      kind: Rule
      services:
        - name: observability-umbrella-grafana
          port: 80
  tls:
    certResolver: letsencrypt
---
# Nextcloud — public HTTPS route
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-secure
  namespace: platform-nextcloud
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nextcloud-demo-flourishing.duckdns.org`)
      kind: Rule
      services:
        - name: nextcloud
          port: http
  tls:
    certResolver: letsencrypt
