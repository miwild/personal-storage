# RoleBinding for platform-nextcloud
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pi-agent-platform-nextcloud
  namespace: platform-nextcloud
subjects:
  - kind: ServiceAccount
    name: pi-agent
    namespace: agent-dev
roleRef:
  kind: ClusterRole
  name: pi-agent-deployer
