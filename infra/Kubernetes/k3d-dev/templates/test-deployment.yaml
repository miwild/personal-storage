apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deployment
  namespace: agent-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: test-service
  namespace: agent-dev
spec:
  selector:
    app: test
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80