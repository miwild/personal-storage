---
# IngressRoute for portfolio-app-1
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-app-1-route
  namespace: portfolio-app-1
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`portfolio-app-1.local.example.com`)
      kind: Rule
      services:
        - name: portfolio-app-1-service
          port: 80
  tls:
    certResolver: letsencrypt
---
