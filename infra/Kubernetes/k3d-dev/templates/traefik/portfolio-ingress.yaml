---
# IngressRoute for Nextcloud
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-nextcloud-route
  namespace: platform-nextcloud
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nextcloud.local.example.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: nextcloud
          port: 8080
  tls:
    secretName: wildcard-cert-secret
---
# IngressRoute for Grafana, Prometheus and Loki
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-observability-route
  namespace: platform-observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.local.example.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
    - match: Host(`prometheus.local.example.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: prometheus-server
          port: 9090
    - match: Host(`loki.local.example.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: loki
          port: 3100
  tls:
    secretName: wildcard-cert-secret
