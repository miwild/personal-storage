## -----------------------------------------------------------------------------
## kube-prometheus-stack values for the shared / production environment
## -----------------------------------------------------------------------------
## Wrapper chart: infra/Kubernetes/helm-charts/observability-umbrella
## Upstream chart: prometheus-community/kube-prometheus-stack 92.11.0
## Release name:   observability-umbrella
## Namespace:      platform-observability
##
## Configuration is kept in single blocks to avoid duplicate YAML keys.
## -----------------------------------------------------------------------------

kube-prometheus-stack:
  ## ---------------------------------------------------------------------------
  ## Grafana
  ## ---------------------------------------------------------------------------
  grafana:
    enabled: true

    ingress:
      enabled: false

    service:
      type: ClusterIP

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

    startupProbe:
      httpGet:
        path: /api/health
        port: grafana
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

    defaultDashboardsEnabled: false

    ## Keep the Global Kubernetes dashboard as the home dashboard.
    grafana.ini:
      dashboards:
        default_home_dashboard_path: /tmp/dashboards/k8s-views-global.json
      auth.anonymous:
        enabled: true
        org_role: Viewer

    persistence:
      enabled: false

    testFramework:
      enabled: false

    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    ## Add Loki while retaining the chart's default Prometheus datasource.
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://observability-umbrella-loki.platform-observability.svc.cluster.local:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000

    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL

      datasources:
        enabled: true

    serviceAccount:
      create: true
      name: ""

    rbac:
      create: true

  ## ---------------------------------------------------------------------------
  ## Prometheus Operator
  ## ---------------------------------------------------------------------------
  prometheusOperator:
    enabled: true

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    serviceAccount:
      create: true
      name: ""

  ## ---------------------------------------------------------------------------
  ## Prometheus
  ## ---------------------------------------------------------------------------
  prometheus:
    enabled: true

    ingress:
      enabled: false

    service:
      type: ClusterIP
      port: 9090

    prometheusSpec:
      retention: 24h
      replicas: 1

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

      ruleSelectorNilUsesHelmValues: true
      serviceMonitorSelectorNilUsesHelmValues: true
      podMonitorSelectorNilUsesHelmValues: true
      probeSelectorNilUsesHelmValues: true

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 3Gi

      additionalScrapeConfigs: []
      remoteWrite: []

    serviceAccount:
      create: true
      name: ""

  ## ---------------------------------------------------------------------------
  ## Alertmanager
  ## ---------------------------------------------------------------------------
  alertmanager:
    enabled: true

    ingress:
      enabled: false

    service:
      type: ClusterIP

    alertmanagerSpec:
      replicas: 1
      retention: 24h

      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi

      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

    config:
      global:
        resolve_timeout: 5m

      inhibit_rules:
        - source_matchers:
            - 'severity = critical'
          target_matchers:
            - 'severity =~ warning|info'
          equal:
            - namespace
            - alertname

        - source_matchers:
            - 'severity = warning'
          target_matchers:
            - 'severity = info'
          equal:
            - namespace
            - alertname

        - source_matchers:
            - 'alertname = InfoInhibitor'
          target_matchers:
            - 'severity = info'
          equal:
            - namespace

        - target_matchers:
            - 'alertname = InfoInhibitor'

      route:
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: "null"
        routes:
          - matchers:
              - 'alertname = "Watchdog"'
            receiver: "null"

      receivers:
        - name: "null"

      templates:
        - /etc/alertmanager/config/*.tmpl

    serviceAccount:
      create: true
      name: ""

  ## ---------------------------------------------------------------------------
  ## kube-state-metrics
  ## ---------------------------------------------------------------------------
  kubeStateMetrics:
    enabled: true

  kube-state-metrics:
    service:
      type: ClusterIP

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    serviceAccount:
      create: true
      name: ""

  ## ---------------------------------------------------------------------------
  ## Node Exporter
  ## ---------------------------------------------------------------------------
  nodeExporter:
    enabled: true

  prometheus-node-exporter:
    service:
      type: ClusterIP

    hostNetwork: true

    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

    serviceAccount:
      create: true
      name: ""

  ## These components remain disabled.
  windowsMonitoring:
    enabled: false

  thanosRuler:
    enabled: false

  ## ---------------------------------------------------------------------------
  ## k3s control-plane scraping
  ## ---------------------------------------------------------------------------
  kubelet:
    enabled: true

  coreDns:
    enabled: true

  kubeEtcd:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeControllerManager:
    enabled: false

  kubeProxy:
    enabled: false

  ## ---------------------------------------------------------------------------
  ## Additional Kubernetes manifests
  ## ---------------------------------------------------------------------------
  extraObjects: []

## -----------------------------------------------------------------------------
## Loki — lightweight single-instance log storage
## Chart: grafana-community/loki 19.0.2
## -----------------------------------------------------------------------------
loki:
  deploymentMode: Monolithic

  loki:
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage:
      type: filesystem
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules

    limits_config:
      retention_period: 72h
      allow_structured_metadata: true

    compactor:
      retention_enabled: true
      delete_request_store: filesystem

  singleBinary:
    enabled: true
    replicas: 1

    persistence:
      enabled: true
      storageClass: local-path
      size: 3Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  gateway:
    enabled: false

  chunksCache:
    enabled: false

  resultsCache:
    enabled: false

  minio:
    enabled: false

  backend:
    replicas: 0

  read:
    replicas: 0

  write:
    replicas: 0

## -----------------------------------------------------------------------------
## Grafana Alloy — collect Kubernetes pod logs and send them to Loki
## Chart: grafana/alloy 1.14.0
## -----------------------------------------------------------------------------
alloy:
  controller:
    type: daemonset

  alloy:
    enableReporting: false

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    configMap:
      create: true
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.local.receiver]
        }

        loki.write "local" {
          endpoint {
            url = "http://observability-umbrella-loki.platform-observability.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

    mounts:
      varlog: true