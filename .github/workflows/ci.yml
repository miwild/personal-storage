name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform configurations
        env:
          TF_IN_AUTOMATION: "1"
        run: |
          set -euo pipefail
          # `terraform validate` resolves providers from .terraform.lock.hcl, so each
          # root module must be initialized first. `-backend=false` keeps the init
          # offline-safe: no S3 backend (and no AWS credentials) are required to validate.
          find infra -name '*.tf' -exec dirname {} \; | sort -u | while read -r dir; do
            echo "Validating $dir"
            (
              cd "$dir"
              terraform init -backend=false -input=false
              terraform validate
            )
          done

      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          find .github/workflows -name '*.yml' -o -name '*.yaml' | while read workflow; do
            echo "Validating $workflow"
            # Basic YAML validation using yq (pre-installed on GitHub runners)
            yq eval '.' "$workflow" >/dev/null
          done
