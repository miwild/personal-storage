name: Deploy Nextcloud

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextcloud-demo-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  NAMESPACE: platform-nextcloud
  CONTROLLER_NAMESPACE: default
  HELM_RELEASE: nextcloud
  CHART_PATH: ./infra/Kubernetes/helm-charts
  NEXTCLOUD_HOST: nextcloud-demo-flourishing.duckdns.org

jobs:
  deploy-nextcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify infrastructure and resolve endpoints
        run: |
          set -euo pipefail

          echo "=== Helm version ==="
          helm version

          echo "=== Check RDS ==="
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier education \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)

          if [ -z "$RDS_ENDPOINT" ] || [ "$RDS_ENDPOINT" = "None" ]; then
            echo "RDS instance education is unavailable."
            exit 1
          fi

          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> "$GITHUB_ENV"
          echo "RDS endpoint resolved."

          echo "=== Check running Kubernetes host ==="
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=k3s-nextcloud-host" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running k3s-nextcloud-host instance found."
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "Kubernetes host found."

          echo "=== Check Client VPN ==="
          ENDPOINT_ID=$(aws ec2 describe-client-vpn-endpoints \
            --query "ClientVpnEndpoints[?Tags[?Key=='Name' && Value=='education-client-vpn']].ClientVpnEndpointId | [0]" \
            --output text)

          if [ -z "$ENDPOINT_ID" ] || [ "$ENDPOINT_ID" = "None" ]; then
            echo "Client VPN endpoint education-client-vpn was not found."
            exit 1
          fi

          echo "ENDPOINT_ID=$ENDPOINT_ID" >> "$GITHUB_ENV"
          echo "Infrastructure checks passed."

      - name: Install kubeseal and OpenVPN
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.3/kubeseal-0.27.3-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeseal

          sudo apt-get update
          sudo apt-get install -y openvpn

          kubectl version --client
          helm version
          aws --version
          kubeseal --version

      - name: Connect to Client VPN
        env:
          VPN_CLIENT_CERT: ${{ secrets.VPN_CLIENT_CERT }}
          VPN_CLIENT_KEY: ${{ secrets.VPN_CLIENT_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$VPN_CLIENT_CERT" ] || [ -z "$VPN_CLIENT_KEY" ]; then
            echo "VPN client certificate or key is missing."
            exit 1
          fi

          aws ec2 export-client-vpn-client-configuration \
            --client-vpn-endpoint-id "$ENDPOINT_ID" \
            --output text > client.ovpn

          {
            printf '\n<cert>\n'
            printf '%s\n' "$VPN_CLIENT_CERT"
            printf '</cert>\n'
            printf '<key>\n'
            printf '%s\n' "$VPN_CLIENT_KEY"
            printf '</key>\n'
          } >> client.ovpn

          chmod 600 client.ovpn

          sudo openvpn \
            --config client.ovpn \
            --daemon \
            --log /tmp/openvpn.log

          for i in $(seq 1 120); do
            if ip addr show tun0 >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          if ! ip addr show tun0 >/dev/null 2>&1; then
            echo "Client VPN connection failed."
            cat /tmp/openvpn.log
            exit 1
          fi

          echo "Client VPN connected."

      - name: Configure Kubernetes through SSM
        run: |
          set -euo pipefail

          IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' \
            --output text)

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "Unable to resolve the Kubernetes host private IP."
            exit 1
          fi

          mkdir -p "$HOME/.kube"

          for i in $(seq 1 40); do
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters '{"commands":["test -s /etc/rancher/k3s/k3s.yaml && /usr/local/bin/k3s kubectl get nodes | grep -qw Ready && cat /etc/rancher/k3s/k3s.yaml"]}' \
              --query 'Command.CommandId' \
              --output text) || {
                sleep 10
                continue
              }

            if aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"; then

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text > "$HOME/.kube/config"

              break
            fi

            sleep 10
          done

          if [ ! -s "$HOME/.kube/config" ]; then
            echo "K3s did not become ready or kubeconfig could not be retrieved."
            exit 1
          fi

          chmod 600 "$HOME/.kube/config"

          sed -i "s/127.0.0.1/$IP/g" "$HOME/.kube/config"

          echo "=== Kubernetes nodes ==="
          kubectl get nodes

          echo "=== Kubernetes namespaces ==="
          kubectl get namespaces

      - name: Pre-stage ACME certificate storage
        env:
          ACME_JSON: ${{ secrets.ACME_JSON }}
        run: |
          set -euo pipefail

          if [ -z "$ACME_JSON" ]; then
            echo "ACME_JSON is not set; skipping certificate storage pre-stage."
            exit 0
          fi

          ENCODED_ACME=$(printf '%s' "$ACME_JSON" | base64 -w 0)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[
              \"mkdir -p /var/lib/rancher/k3s/storage/traefik-acme\",
              \"printf '%s' '$ENCODED_ACME' | base64 -d > /var/lib/rancher/k3s/storage/traefik-acme/acme.json\",
              \"chmod 600 /var/lib/rancher/k3s/storage/traefik-acme/acme.json\"
            ]}" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "ACME certificate storage staged."

      - name: Prepare namespaces
        run: |
          set -euo pipefail

          kubectl apply \
            -f infra/Kubernetes/templates/namespaces/platform-namespaces.yaml

          kubectl get namespace "$NAMESPACE"
          kubectl get namespace "$CONTROLLER_NAMESPACE"

      - name: Separate Sealed Secrets from the Nextcloud chart
        run: |
          set -euo pipefail

          helm repo add nextcloud https://nextcloud.github.io/helm
          helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
          helm repo update

          # Install the controller as its own release in default.
          helm upgrade --install sealed-secrets-controller \
            sealed-secrets/sealed-secrets \
            --namespace "$CONTROLLER_NAMESPACE" \
            --version 2.19.3 \
            --set fullnameOverride=sealed-secrets-controller \
            --set crd.create=true \
            --set crd.keep=true \
            --wait \
            --timeout 180s

          kubectl rollout status \
            deployment/sealed-secrets-controller \
            --namespace "$CONTROLLER_NAMESPACE" \
            --timeout=180s

          # Create a temporary copy of the umbrella chart that contains
          # only the Nextcloud dependency. This avoids installing a
          # second controller in platform-nextcloud.
          CHART_DIR="$RUNNER_TEMP/nextcloud-chart"

          rm -rf "$CHART_DIR"
          mkdir -p "$CHART_DIR"

          cp -R "$CHART_PATH/." "$CHART_DIR/"

          # Remove the sealed-secrets dependency from the temporary
          # Chart.yaml; leave the repository copy unchanged.
          sed -i \
            '/  - name: sealed-secrets/,/repository: "https:\/\/bitnami.github.io\/sealed-secrets"/d' \
            "$CHART_DIR/Chart.yaml"

          # Rebuild dependencies from the modified Chart.yaml.
          rm -f "$CHART_DIR"/charts/*.tgz
          rm -f "$CHART_DIR/Chart.lock"

          helm dependency update "$CHART_DIR"

          echo "=== Prepared chart dependencies ==="
          ls -lh "$CHART_DIR/charts"

          if ls "$CHART_DIR"/charts/sealed-secrets-*.tgz >/dev/null 2>&1; then
            echo "Unexpected Sealed Secrets chart dependency remains."
            exit 1
          fi

          echo "CHART_DIR=$CHART_DIR" >> "$GITHUB_ENV"

      - name: Create database SealedSecret
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "DB_USERNAME or DB_PASSWORD GitHub secret is missing."
            exit 1
          fi

          kubectl create secret generic db-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client \
            -o yaml \
            | kubeseal \
                --controller-namespace "$CONTROLLER_NAMESPACE" \
                --controller-name sealed-secrets-controller \
                --format yaml \
            | kubectl apply -f -

          # Wait for the controller to unseal the Secret in the
          # target application namespace.
          for i in $(seq 1 60); do
            if kubectl get secret db-secrets \
                --namespace "$NAMESPACE" \
                -o jsonpath='{.data.DB_USERNAME}' 2>/dev/null | grep -q . \
              && kubectl get secret db-secrets \
                --namespace "$NAMESPACE" \
                -o jsonpath='{.data.DB_PASSWORD}' 2>/dev/null | grep -q .; then
              echo "Database Secret is available in $NAMESPACE."
              exit 0
            fi

            sleep 2
          done

          echo "The database Secret was not created."
          kubectl get sealedsecrets --namespace "$NAMESPACE" || true
          kubectl get events --namespace "$NAMESPACE" \
            --sort-by='.metadata.creationTimestamp' | tail -n 40 || true
          exit 1

      - name: Deploy Nextcloud
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ADMIN_USER" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "ADMIN_USER or ADMIN_PASSWORD GitHub secret is missing."
            exit 1
          fi

          echo "=== Deploy Nextcloud into $NAMESPACE ==="

          helm template "$HELM_RELEASE" "$CHART_DIR" \
            --namespace "$NAMESPACE" \
            -f "$CHART_PATH/values.yaml" \
            --set nextcloud.externalDatabase.host="$RDS_ENDPOINT" \
            --set-string nextcloud.nextcloud.username="$ADMIN_USER" \
            --set-string nextcloud.nextcloud.password="$ADMIN_PASSWORD" \
            > "$RUNNER_TEMP/nextcloud-rendered.yaml"

          echo "Rendered manifest size:"
          wc -c "$RUNNER_TEMP/nextcloud-rendered.yaml"

          helm upgrade --install "$HELM_RELEASE" "$CHART_DIR" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$CHART_PATH/values.yaml" \
            --set nextcloud.externalDatabase.host="$RDS_ENDPOINT" \
            --set-string nextcloud.nextcloud.username="$ADMIN_USER" \
            --set-string nextcloud.nextcloud.password="$ADMIN_PASSWORD" \
            --wait \
            --timeout 10m

          echo "=== Verify deployment ==="
          kubectl rollout status deployment/nextcloud \
            --namespace "$NAMESPACE" \
            --timeout=300s

          kubectl get pods,services,pvc \
            --namespace "$NAMESPACE" \
            -o wide

      - name: Verify or install Nextcloud
        run: |
          set -euo pipefail

          echo "=== Check Nextcloud installation ==="

          if STATUS=$(kubectl exec \
            --namespace "$NAMESPACE" \
            deployment/nextcloud \
            -- php occ status 2>&1); then

            echo "$STATUS"

            if echo "$STATUS" | grep -q 'installed: true'; then
              echo "Nextcloud is already installed."
              exit 0
            fi
          else
            echo "$STATUS"
            echo "Could not check Nextcloud status."
            exit 1
          fi

          echo "=== Install Nextcloud ==="

          kubectl exec \
            --namespace "$NAMESPACE" \
            deployment/nextcloud \
            -- sh -c '
              php occ maintenance:install \
                --database=pgsql \
                --database-host="$POSTGRES_HOST" \
                --database-name="$POSTGRES_DB" \
                --database-user="$POSTGRES_USER" \
                --database-pass="$POSTGRES_PASSWORD" \
                --admin-user="$NEXTCLOUD_ADMIN_USER" \
                --admin-pass="$NEXTCLOUD_ADMIN_PASSWORD"
            '

          kubectl exec \
            --namespace "$NAMESPACE" \
            deployment/nextcloud \
            -- php occ status

      - name: Set login page message and link
        run: |
          set -euo pipefail

          kubectl exec \
            --namespace "$NAMESPACE" \
            deployment/nextcloud \
            -- php occ theming:config name \
              "Click here for the Demo login credentials"

          kubectl exec \
            --namespace "$NAMESPACE" \
            deployment/nextcloud \
            -- php occ theming:config url \
              "https://github.com/miwild/platform-engineering#demo-credentials"

          kubectl exec \
            --namespace "$NAMESPACE" \
            deployment/nextcloud \
            -- php occ theming:config slogan ""

      - name: Apply Nextcloud ingress route
        run: |
          set -euo pipefail

          echo "=== Check Traefik CRD ==="

          if ! kubectl get crd ingressroutes.traefik.io >/dev/null 2>&1; then
            echo "Traefik IngressRoute CRD is missing."
            exit 1
          fi

          echo "=== Apply configured IngressRoutes ==="

          kubectl apply \
            -f infra/Kubernetes/templates/traefik/ingress.yaml

          echo "=== Verify Nextcloud Service ==="

          kubectl get service nextcloud \
            --namespace "$NAMESPACE"

          echo "=== Verify Nextcloud route ==="

          kubectl get ingressroute nextcloud-secure \
            --namespace "$NAMESPACE" \
            -o yaml

      - name: Final verification
        run: |
          set -euo pipefail

          echo "=== Pods ==="
          kubectl get pods --namespace "$NAMESPACE" -o wide

          echo "=== Services ==="
          kubectl get services --namespace "$NAMESPACE"

          echo "=== PVCs ==="
          kubectl get pvc --namespace "$NAMESPACE"

          echo "=== Nextcloud application status ==="
          kubectl exec \
            --namespace "$NAMESPACE" \
            deployment/nextcloud \
            -- php occ status

          echo "=== IngressRoute ==="
          kubectl get ingressroute nextcloud-secure \
            --namespace "$NAMESPACE"

          echo "Deployment checks passed."
          echo "Nextcloud URL: https://$NEXTCLOUD_HOST"