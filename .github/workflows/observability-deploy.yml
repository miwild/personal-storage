name: Deploy Observability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-deploy
  cancel-in-progress: false

env:
  NAMESPACE: platform-observability
  RELEASE: observability-umbrella
  CHART: ./infra/Kubernetes/helm-charts/observability-umbrella

jobs:
  deploy-observability:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: latest

      - uses: azure/setup-helm@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1

      - name: Verify deployment tools
        run: |
          set -euo pipefail
          kubectl version --client
          helm version
          aws --version

      - name: Verify infrastructure readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_STATUS_KV_NAMESPACE_ID: ${{ secrets.DEMO_STATUS_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail

          # Do not deploy while scheduled or manual cleanup is running.
          if [ -z "$CLOUDFLARE_API_TOKEN" ] ||
             [ -z "$CLOUDFLARE_ACCOUNT_ID" ] ||
             [ -z "$DEMO_STATUS_KV_NAMESPACE_ID" ]; then
            echo "Cloudflare KV credentials or namespace configuration are missing."
            exit 1
          fi

          STATUS_FILE=$(mktemp)
          trap 'rm -f "$STATUS_FILE"' EXIT

          HTTP_STATUS=$(curl --silent --show-error \
            --output "$STATUS_FILE" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${DEMO_STATUS_KV_NAMESPACE_ID}/values/cleanupStatus")

          case "$HTTP_STATUS" in
            200)
              CLEANUP_STATUS=$(cat "$STATUS_FILE")
              if [ "$CLEANUP_STATUS" = "running" ]; then
                echo "Infrastructure is not ready: cleanup is currently running."
                exit 1
              fi
              ;;
            404)
              echo "No active cleanup status found."
              ;;
            *)
              echo "Could not verify cleanup status (HTTP $HTTP_STATUS)."
              cat "$STATUS_FILE"
              exit 1
              ;;
          esac

          # Find the currently running K3s host.
          INSTANCE_INFO=$(aws ec2 describe-instances \
            --region ca-central-1 \
            --filters \
              "Name=tag:Name,Values=k3s-nextcloud-host" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].[InstanceId,PrivateIpAddress]' \
            --output text)

          if [ -z "$INSTANCE_INFO" ] || [ "$INSTANCE_INFO" = "None" ]; then
            echo "Infrastructure is not ready: no running K3s instance found."
            exit 1
          fi

          read -r INSTANCE_ID PRIVATE_IP <<< "$INSTANCE_INFO"

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] ||
             [ -z "$PRIVATE_IP" ] || [ "$PRIVATE_IP" = "None" ]; then
            echo "Could not determine the running K3s instance details."
            exit 1
          fi

          echo "Found K3s instance: $INSTANCE_ID"

          # Wait up to 10 minutes for both AWS status checks to pass.
          INSTANCE_READY=false

          for i in $(seq 1 40); do
            STATUS=$(aws ec2 describe-instance-status \
              --region ca-central-1 \
              --instance-ids "$INSTANCE_ID" \
              --query 'InstanceStatuses[0].[InstanceStatus.Status,SystemStatus.Status]' \
              --output text)

            read -r INSTANCE_STATUS SYSTEM_STATUS <<< "$STATUS"

            if [ "$INSTANCE_STATUS" = "ok" ] &&
               [ "$SYSTEM_STATUS" = "ok" ]; then
              INSTANCE_READY=true
              break
            fi

            echo "Waiting for EC2 status checks ($i/40): instance=${INSTANCE_STATUS:-unknown}, system=${SYSTEM_STATUS:-unknown}"
            sleep 15
          done

          if [ "$INSTANCE_READY" != true ]; then
            echo "Infrastructure is not ready: EC2 status checks did not pass."
            exit 1
          fi

          # Check cleanup status again to reduce the chance of a race.
          HTTP_STATUS=$(curl --silent --show-error \
            --output "$STATUS_FILE" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${DEMO_STATUS_KV_NAMESPACE_ID}/values/cleanupStatus")

          if [ "$HTTP_STATUS" = "200" ] &&
             [ "$(cat "$STATUS_FILE")" = "running" ]; then
            echo "Infrastructure is not ready: cleanup started during the readiness check."
            exit 1
          elif [ "$HTTP_STATUS" != "200" ] &&
               [ "$HTTP_STATUS" != "404" ]; then
            echo "Could not recheck cleanup status (HTTP $HTTP_STATUS)."
            cat "$STATUS_FILE"
            exit 1
          fi

          echo "Infrastructure readiness checks passed."

      - name: Connect to Client VPN
        env:
          VPN_CLIENT_CERT: ${{ secrets.VPN_CLIENT_CERT }}
          VPN_CLIENT_KEY: ${{ secrets.VPN_CLIENT_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openvpn

          ENDPOINT_ID=$(aws ec2 describe-client-vpn-endpoints \
            --query "ClientVpnEndpoints[?Tags[?Key=='Name' && Value=='education-client-vpn']].ClientVpnEndpointId | [0]" \
            --output text)

          if [ -z "$ENDPOINT_ID" ] || [ "$ENDPOINT_ID" = "None" ]; then
            echo "No Client VPN endpoint found. Is the stack up?"
            exit 1
          fi

          if [ -z "$VPN_CLIENT_CERT" ] || [ -z "$VPN_CLIENT_KEY" ]; then
            echo "VPN_CLIENT_CERT or VPN_CLIENT_KEY is missing."
            exit 1
          fi

          aws ec2 export-client-vpn-client-configuration \
            --client-vpn-endpoint-id "$ENDPOINT_ID" \
            --output text > client.ovpn

          {
            printf '\n<cert>\n%s\n</cert>\n' "$VPN_CLIENT_CERT"
            printf '<key>\n%s\n</key>\n' "$VPN_CLIENT_KEY"
          } >> client.ovpn

          chmod 600 client.ovpn
          sudo openvpn --config client.ovpn --daemon --log /tmp/openvpn.log

          for i in $(seq 1 120); do
            if ip addr show tun0 >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          if ! ip addr show tun0 >/dev/null 2>&1; then
            cat /tmp/openvpn.log
            exit 1
          fi

      - name: Configure Kubernetes through SSM
        run: |
          set -euo pipefail

          INSTANCE_INFO=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=k3s-nextcloud-host" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].[InstanceId,PrivateIpAddress]" \
            --output text)

          read -r INSTANCE_ID IP <<< "$INSTANCE_INFO"

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] ||
             [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "No running k3s instance found."
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          KUBECONFIG_TMP=$(mktemp)
          trap 'rm -f "$KUBECONFIG_TMP"' EXIT
          READY=false

          for i in $(seq 1 40); do
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters '{"commands":["test -s /etc/rancher/k3s/k3s.yaml && /usr/local/bin/k3s kubectl get nodes | grep -qw Ready && cat /etc/rancher/k3s/k3s.yaml"]}' \
              --query 'Command.CommandId' \
              --output text) || {
                sleep 10
                continue
              }

            if aws ssm wait command-executed \
                 --command-id "$COMMAND_ID" \
                 --instance-id "$INSTANCE_ID"; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text > "$KUBECONFIG_TMP"

              if [ -s "$KUBECONFIG_TMP" ] &&
                 grep -q 'server: https://127.0.0.1:6443' "$KUBECONFIG_TMP"; then
                READY=true
                break
              fi
            fi

            sleep 10
          done

          if [ "$READY" != true ]; then
            echo "K3s did not become ready or its kubeconfig was not retrieved."
            exit 1
          fi

          sed "s|https://127.0.0.1:6443|https://${IP}:6443|" \
            "$KUBECONFIG_TMP" > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

          kubectl get nodes

      - name: Apply namespaces
        run: |
          set -euo pipefail
          kubectl apply \
            -f infra/Kubernetes/templates/namespaces/platform-namespaces.yaml
          kubectl get namespace "$NAMESPACE"

      - name: Create Grafana admin Secret
        env:
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$GRAFANA_ADMIN_USER" ] ||
             [ -z "$GRAFANA_ADMIN_PASSWORD" ]; then
            echo "GRAFANA_ADMIN_USER and GRAFANA_ADMIN_PASSWORD must both be configured in GitHub Actions secrets."
            exit 1
          fi

          kubectl create secret generic grafana-admin \
            --namespace "$NAMESPACE" \
            --from-literal=admin-user="$GRAFANA_ADMIN_USER" \
            --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
            --dry-run=client -o yaml |
            kubectl apply -f -

          kubectl get secret grafana-admin -n "$NAMESPACE"

      - name: Provision Grafana Global dashboard
        run: |
          set -euo pipefail

          DASHBOARD_URL=https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
          DASHBOARD_FILE="$RUNNER_TEMP/k8s-views-global.json"

          curl -fsSL --retry 3 --retry-delay 5 "$DASHBOARD_URL" -o "$DASHBOARD_FILE"

          # Fail early if the download isn't a valid dashboard
          jq -e '.title' "$DASHBOARD_FILE" >/dev/null
          echo "Downloaded: $(jq -r '.title' "$DASHBOARD_FILE") ($(wc -c < "$DASHBOARD_FILE") bytes)"

          kubectl create configmap grafana-dashboard-k8s-views-global \
            --namespace "$NAMESPACE" \
            --from-file=k8s-views-global.json="$DASHBOARD_FILE" \
            --dry-run=client -o yaml \
            | kubectl label --local -f - grafana_dashboard=1 -o yaml \
            | kubectl apply --server-side --force-conflicts -f -

          kubectl get configmap grafana-dashboard-k8s-views-global \
            --namespace "$NAMESPACE"

      - name: Build chart dependencies and validate
        run: |
          set -euo pipefail

          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo add grafana-community \
            https://grafana-community.github.io/helm-charts
          helm repo add grafana \
            https://grafana.github.io/helm-charts
          helm repo update
          helm dependency build "$CHART"
          helm lint "$CHART"

          helm template "$RELEASE" "$CHART" \
            --namespace "$NAMESPACE" \
            -f "$CHART/values.yaml" \
            > /tmp/observability-rendered.yaml

          echo "Helm template validation passed."

      - name: Deploy observability-umbrella
        run: |
          set -euo pipefail

          helm upgrade --install "$RELEASE" "$CHART" \
            -f "$CHART/values.yaml" \
            --namespace "$NAMESPACE" \
            --wait \
            --timeout 10m

          kubectl wait --for=condition=Ready \
            pod -l app.kubernetes.io/instance="$RELEASE" \
            -n "$NAMESPACE" \
            --timeout=600s

      - name: Apply Traefik IngressRoutes
        run: |
          set -euo pipefail
          ROUTES=infra/Kubernetes/templates/traefik/ingress.yaml

          if ! kubectl get crd ingressroutes.traefik.io >/dev/null 2>&1; then
            echo "::warning file=$ROUTES::Traefik CRDs are not installed; skipping IngressRoutes."
            exit 0
          fi

          if grep -q 'placeholder' "$ROUTES"; then
            echo "::warning file=$ROUTES::IngressRoutes were not applied because hostnames remain placeholders."
            exit 0
          fi

          kubectl apply -f "$ROUTES"

      - name: Verify deployment
        run: |
          set -euo pipefail

          echo "=== Kubernetes context ==="
          kubectl config current-context

          echo "=== Pods ==="
          kubectl get pods -n "$NAMESPACE" \
            -l app.kubernetes.io/instance="$RELEASE"

          echo "=== Services ==="
          kubectl get svc -n "$NAMESPACE"

          echo "=== Grafana Secret keys (values are not displayed) ==="
          kubectl get secret grafana-admin -n "$NAMESPACE" \
            -o jsonpath='{.data}' | jq -r 'keys[]'

          echo "=== Alertmanager receiver configuration ==="
          kubectl get secret "alertmanager-$RELEASE-kub-alertmanager" \
            -n "$NAMESPACE" \
            -o jsonpath='{.data.alertmanager\.yaml}' |
            base64 -d |
            sed -n '/^receivers:/,/^templates:/p'