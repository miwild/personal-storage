name: Terraform Dev

on:
  workflow_dispatch:
  # Manual trigger only for dev environment

permissions:
  contents: read

concurrency:
  group: nextcloud-dev-provisioning
  cancel-in-progress: false

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ca-central-1
      TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD || 'devpassword123' }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Validate Terraform configurations
        env:
          TF_IN_AUTOMATION: "1"
        run: |
          set -euo pipefail
          # `terraform validate` resolves providers from .terraform.lock.hcl, so each
          # root module must be initialized first. `-backend=false` keeps the init
          # offline-safe: no S3 backend (and no AWS credentials) are required to validate.
          find infra/dev -name '*.tf' -exec dirname {} \; | sort -u | while read -r dir; do
            echo "Validating $dir"
            (
              cd "$dir"
              terraform init -backend=false -input=false
              terraform validate
            )
          done

  terraform-plan:
    needs: terraform-validate
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ca-central-1
      TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD || 'devpassword123' }}
      TF_VAR_ssh_public_key: ${{ secrets.DEV_SSH_PUBLIC_KEY || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1

      - name: Terraform Plan - AWS Module
        run: |
          set -euo pipefail
          cd infra/dev/AWS
          terraform init -input=false
          terraform plan -input=false -out=tfplan

      - name: Terraform Plan - RDS Module
        run: |
          set -euo pipefail
          cd infra/dev/RDS
          terraform init -input=false
          terraform plan -input=false -out=tfplan

      # Note: ACM module is minimal in dev environment