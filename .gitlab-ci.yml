stages:
  - deploy

deploy-nextcloud:
  stage: deploy
  image:
    name: alpine/helm:4.2.4
    entrypoint: [""]
  before_script:
    - echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - helm repo add nextcloud https://nextcloud.github.io/helm
    - helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
    - helm repo update
    - helm dependency build ./infra/helm-charts
    - helm upgrade --install nextcloud ./infra/helm-charts -f ./infra/helm-charts/values.yaml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - infra/helm-charts/**/*
        - .gitlab-ci.yml